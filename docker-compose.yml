# Optional real services — the prototype runs fully WITHOUT Docker (local mocks).
#
# Start these to exercise the production adapters (src/ingestion/postgres.py,
# src/ingestion/elasticsearch.py) instead of the local CSV/NDJSON mocks:
#
#   docker compose up -d
#   export POSTGRES_HOST=localhost POSTGRES_USER=etl POSTGRES_PASSWORD=etl
#   export ELASTICSEARCH_URL=http://localhost:9200
#   make run
#
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
